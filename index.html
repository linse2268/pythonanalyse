<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio-Aufmerksamkeitsanalyse</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; max-width: 760px; }
    progress { width: 100%; height: 18px; }
    pre { background: #f3f3f3; padding: 8px; overflow-x: auto; font-size: 12px; }
    @media (prefers-color-scheme: dark) { body { background:#111; color:#eee; } pre { background:#222; } }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid #888; border-top-color:transparent;
            border-radius:50%; animation: s 0.8s linear infinite; vertical-align:middle; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h3>Audio-Aufmerksamkeitsanalyse <span class="spin" title="UI läuft flüssig, solange der Worker rechnet"></span></h3>

  <input type="file" id="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a">
  <label style="display:block;margin:8px 0"><input type="checkbox" id="exportJson"> onset.json / pitch.json exportieren</label>
  <button id="run">Analysieren</button>

  <p id="status">Bereit.</p>
  <progress id="bar" value="0" max="1"></progress>

  <pre id="out"></pre>
  <div id="downloads"></div>
  <details><summary>Rohes Ergebnis-JSON</summary><pre id="json"></pre></details>

  <script src="main.js"></script>
</body>
</html>
